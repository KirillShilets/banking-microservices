plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.bank'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:3.5.15"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
    }
}

dependencies {
    api 'org.springframework:spring-webmvc'

    compileOnly 'org.projectlombok:lombok'
    compileOnlyApi 'jakarta.servlet:jakarta.servlet-api'

    api 'org.springframework.boot:spring-boot-starter-json'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'org.springframework.boot:spring-boot-starter-amqp'

    implementation 'org.springframework.security:spring-security-core'

    // Used only by the @Profile("migrate") LiquibaseMigrationRunner; consumers
    // (account/bill/deposit/notification-service) already ship liquibase-core at runtime.
    compileOnly 'org.liquibase:liquibase-core'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.liquibase:liquibase-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'jakarta.servlet:jakarta.servlet-api'
}

test {
    useJUnitPlatform()
}
