services:
  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: http://keycloak.localhost:8080
        VITE_KEYCLOAK_REALM: bank-realm
        VITE_KEYCLOAK_CLIENT_ID: banking-frontend
        VITE_GATEWAY_URL: http://localhost:8989
    ports:
      - "3000:80"
    depends_on:
      - gateway-service
    networks:
      - bank-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.1
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_database
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME: http://keycloak.localhost:8080
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD-SHELL", "timeout 5 bash -c '</dev/tcp/localhost/9000' || exit 1" ]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 60s
    networks:
      - bank-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - bank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-bankmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-bankmqpass}
    ports:
      - "${RABBITMQ_EXTERNAL_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  config-service:
    build:
      context: ./config-service
    container_name: config-service
    environment:
      SPRING_PROFILES_ACTIVE: native
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    volumes:
      - ./config-service/src/main/resources/services:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u $SPRING_SECURITY_USER_NAME:$SPRING_SECURITY_PASSWORD http://localhost:8001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - bank-net

  discovery-service:
    build:
      context: ./discovery-service
      dockerfile: Dockerfile
    container_name: discovery-service
    depends_on:
      config-service:
        condition: service_healthy
    environment:
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  bill-service:
    build:
      context: .
      dockerfile: bill-service/Dockerfile
    container_name: bill-service
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bill_service_database
      SPRING_DATASOURCE_USERNAME: ${BILL_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${BILL_DB_PASSWORD}
      DEPOSIT_MIN_AMOUNT: ${DEPOSIT_MIN_AMOUNT}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    container_name: account-service
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bill-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_service_database
      SPRING_DATASOURCE_USERNAME: ${ACCOUNT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  deposit-service:
    build:
      context: .
      dockerfile: deposit-service/Dockerfile
    container_name: deposit-service
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bill-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/deposit_service_database
      SPRING_DATASOURCE_USERNAME: ${DEPOSIT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DEPOSIT_DB_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    container_name: gateway-service
    depends_on:
      discovery-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
      bill-service:
        condition: service_healthy
      deposit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${GATEWAY_SERVICE_PORT}:8989"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka
      SPRING_SECURITY_USER_NAME: ${SPRING_SECURITY_USER_NAME}
      SPRING_SECURITY_PASSWORD: ${SPRING_SECURITY_PASSWORD}
    networks:
      - bank-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/actuator/health" ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  bank-net:
    driver: bridge

volumes:
  postgres_data: