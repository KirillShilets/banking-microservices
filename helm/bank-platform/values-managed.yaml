global:
  environment: prod
  imageRegistry: "ghcr.io/kirillshilets"
  existingSecret: "bank-app-secrets"
  imagePullSecrets:
    - name: ghcr-pull
  keycloak:
    issuerUri: "https://auth.bank.example.com/realms/bank-realm"
    jwkSetUri: "https://auth.bank.example.com/realms/bank-realm/protocol/openid-connect/certs"
  external:
    rabbitmqHost: "rabbitmq.cluster.local"
    rabbitmqPort: 5672
  springProfilesActive: "kubernetes,production"
  topologySpreadConstraints:
    enabled: true
    whenUnsatisfiable: DoNotSchedule

frontendConfig:
  KEYCLOAK_URL: "https://auth.bank.example.com"
  KEYCLOAK_REALM: "bank-realm"
  KEYCLOAK_CLIENT_ID: "banking-frontend"
  GATEWAY_URL: "https://api.bank.example.com"

ingress:
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://auth.bank.example.com https://api.bank.example.com wss:; frame-ancestors 'none'" always;

externalServices:
  postgres:
    enabled: false
  rabbitmq:
    enabled: false

resources:
  spring:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  gateway:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 64Mi

services:
  config-service:
    replicas: 2
  discovery-service:
    replicas: 2
    enabled: false

  account-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/account_service_database"
  bill-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/bill_service_database"
      APP_SANDBOX_DEPOSITS_ENABLED: "false"
      DEPOSIT_MIN_AMOUNT: "10.00"
  deposit-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/deposit_service_database"
  notification-service:
    replicas: 1
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notification_service_database"
      MAIL_HOST: "smtp.eu.mailgun.org"
      MAIL_PORT: "587"

  gateway-service:
    replicas: 3
    ingress:
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
      hosts:
        - host: api.bank.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: bank-api-tls
          hosts:
            - api.bank.example.com
  frontend:
    replicas: 3
    ingress:
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
      hosts:
        - host: app.bank.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: bank-app-tls
          hosts:
            - app.bank.example.com
