global:
  environment: prod
  imageRegistry: "REPLACE_ME.dkr.ecr.eu-central-1.amazonaws.com"
  existingSecret: "bank-app-secrets"
  keycloak:
    issuerUri: "https://auth.bank.example.com/realms/bank-realm"
  topologySpreadConstraints:
    enabled: true
    whenUnsatisfiable: DoNotSchedule

external:
  keycloakHost: "auth.bank.example.com"
  rabbitmqHost: "b-xxxx.mq.eu-central-1.amazonaws.com"

liquibase:
  migrationJob:
    enabled: true

networkPolicy:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: kube-prometheus-stack

resources:
  spring:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  gateway:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 1Gi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 64Mi

services:
  config-service:
    replicas: 2

  discovery-service:
    replicas: 2

  account-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bank-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/account_service_database?sslmode=verify-full"
      SPRING_DATASOURCE_USERNAME: "account_service_admin"
      RABBITMQ_HOST: "b-xxxx.mq.eu-central-1.amazonaws.com"
      RABBITMQ_PORT: "5671"
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

  bill-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bank-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/bill_service_database?sslmode=verify-full"
      SPRING_DATASOURCE_USERNAME: "bill_service_admin"
      RABBITMQ_HOST: "b-xxxx.mq.eu-central-1.amazonaws.com"
      RABBITMQ_PORT: "5671"
      APP_SANDBOX_DEPOSITS_ENABLED: "false"
      DEPOSIT_MIN_AMOUNT: "10.00"
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

  deposit-service:
    replicas: 3
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bank-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/deposit_service_database?sslmode=verify-full"
      SPRING_DATASOURCE_USERNAME: "deposit_service_admin"
      RABBITMQ_HOST: "b-xxxx.mq.eu-central-1.amazonaws.com"
      RABBITMQ_PORT: "5671"
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

  notification-service:
    replicas: 1
    env:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://bank-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/notification_service_database?sslmode=verify-full"
      SPRING_DATASOURCE_USERNAME: "notification_service_admin"
      RABBITMQ_HOST: "b-xxxx.mq.eu-central-1.amazonaws.com"
      RABBITMQ_PORT: "5671"
      MAIL_HOST: "smtp.eu.mailgun.org"
      MAIL_PORT: "587"
      MAIL_USERNAME: "bank-notifications@bank.example.com"

  gateway-service:
    replicas: 3
    ingress:
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
      hosts:
        - host: api.bank.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: bank-api-tls
          hosts:
            - api.bank.example.com
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1

  frontend:
    replicas: 3
    ingress:
      className: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
        alb.ingress.kubernetes.io/ssl-redirect: "443"
      hosts:
        - host: app.bank.example.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: bank-app-tls
          hosts:
            - app.bank.example.com
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1