{{- if .Values.applicationConfig.enabled }}
{{- $path := "config/config-service/src/main/resources/services" }}
{{- $files := .Files.Glob (printf "%s/*" $path) }}
{{- if not $files }}
{{- fail (printf "applicationConfig.enabled is true but no configuration files were found at %s/ inside the chart. Run deploy/scripts/sync-config.ps1, or set applicationConfig.enabled=false." $path) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-application-config" (include "bank-platform.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-platform.labels" . | nindent 4 }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    config.bank.io/sync-source: {{ $path | quote }}
data:
    {{- range $path, $bytes := $files }}
  {{ base $path }}: |
    {{- $bytes | toString | nindent 4 }}
  {{- end }}
{{- end }}
