{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bank-platform.fullname" . }}-allow-smtp
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  policyTypes: [Egress]
  egress:
    # Egress to external SMTP servers (smtp.gmail.com / Mailgun) on standard
    # submission + SMTPS ports. Startup must still be able to resolve DNS.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 25 }
        - { protocol: TCP, port: 465 }
        - { protocol: TCP, port: 587 }
{{- end }}
