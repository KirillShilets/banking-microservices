apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bank-platform.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bank-platform.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # IRSA on EKS:      eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bank-platform
    # Workload Identity on GKE: iam.gke.io/gcp-service-account: bank-platform@PROJECT.iam.gserviceaccount.com
    # Azure Workload Identity:  azure.workload.identity/client-id: <client-id>
    #
    # When any of these are used, set serviceAccount.automountServiceAccountToken
    # to true, otherwise the projected token is not available to the pod.
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
