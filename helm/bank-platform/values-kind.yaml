global:
  keycloak:
    issuerUri: "http://keycloak.localhost/realms/bank-realm"
    jwkSetUri: "http://keycloak:8080/realms/bank-realm/protocol/openid-connect/certs"
  environment: kind
  imageRegistry: ""
  qosGuaranteed: false
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
  topologySpreadConstraints:
    enabled: false

externalServices:
  postgres:
    enabled: false
  rabbitmq:
    enabled: false

probes:
  startup:
    failureThreshold: 60
    timeoutSeconds: 5
  readiness:
    timeoutSeconds: 5
  liveness:
    timeoutSeconds: 5

resources:
  spring:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 512Mi
  gateway:
    requests:
      cpu: 250m
      memory: 448Mi
    limits:
      cpu: "1"
      memory: 640Mi
  frontend:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 64Mi

services:
  config-service:
    replicas: 1
  discovery-service:
    replicas: 1
    enabled: false
  account-service:
    replicas: 1
  bill-service:
    replicas: 1
    env:
      APP_SANDBOX_DEPOSITS_ENABLED: "true"
  deposit-service:
    replicas: 1
  notification-service:
    replicas: 1
    env:
      MAIL_HOST: "smtp.gmail.com"
      MAIL_PORT: "587"
      SPRING_MAIL_HOST: "smtp.gmail.com"
      SPRING_MAIL_PORT: "587"
  gateway-service:
    replicas: 1
  frontend:
    replicas: 1

networkPolicies:
  # kindnet does not enforce NetworkPolicy; enable them anyway so the manifests
  # render and are exercised. The namespace carries warn/audit PSA labels
  # applied by bootstrap.sh/bootstrap.ps1.
  enabled: true
