spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account_service_route
              uri: http://account-service:8081
              predicates:
                - Path=/accounts/**
            - id: bill_service_route
              uri: http://bill-service:8082
              predicates:
                - Path=/bills/**
            - id: deposit_service_route
              uri: http://deposit-service:8083
              predicates:
                - Path=/deposits/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://app.localhost"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
