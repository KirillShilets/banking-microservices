spring:
  application:
    name: bill-service
  cloud:
    config:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:1/dummy

# Mirrors the deployed value from the shared configuration so the integration
# context binds the same deposit policy the service runs with.
app:
  deposit:
    min-amount: 2.60
  # Keep the background relay and the retention job out of the test window:
  # their first run happens at startup, before any test writes a row.
  outbox:
    scheduler:
      fixed-delay: 3600000
    cleanup:
      fixed-delay: 3600000
      initial-delay: 3600000
