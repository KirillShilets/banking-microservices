name: e2e

# Кластер e2e больше не создаётся автоматически — только по запросу
# (Workflow_dispatch), чтобы случайно не расходовать ресурсы CI.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ENV_FILE: .env.ci

jobs:
  e2e:
    name: End-to-end (kind + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Автоматический запуск e2e отключён — кластер создаётся только при
      # ручном запуске workflow_dispatch (через кнопку "Run workflow").
      # Блоки фильтрации изменений удалены, так как все шаги выполняются
      # при ручном запуске.

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4

      - name: Set up kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: 'true'
          cluster_name: bank-ci
          version: v0.24.0
          config: deploy/kind/kind-cluster-ci.yaml

      - name: Generate CI .env
        run: bash deploy/ci/gen-env.sh "$ENV_FILE"

      - name: Generate CI smoke credentials
        run: |
          # Fresh random password per run; never reuse demo credentials.
          echo "CI_PASS=$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Overlay CI realm (ci-smoke client, no TLS, random creds)
        env:
          REALM_USER_PASSWORD: ${{ env.CI_PASS }}
        run: |
          jq -f deploy/ci/realm-overlay.jq keycloak/import/bank-realm-realm.json \
            > "$RUNNER_TEMP/bank-realm-ci.json"
          echo "Overlay produced:"
          jq '.sslRequired, [.clients[] | select(.clientId=="ci-smoke") | .clientId]' \
            "$RUNNER_TEMP/bank-realm-ci.json"

      - name: Bootstrap platform (cluster, operators, infra, images, helm)
        env:
          ENV_FILE: "${{ env.ENV_FILE }}"
          REALM_FILE: "${{ runner.temp }}/bank-realm-ci.json"
          IMAGE_TAG: "1.0-SNAPSHOT"
          CLUSTER_NAME: bank-ci
        run: bash deploy/kind/bootstrap.sh

      - name: Run smoke tests
        env:
          CI_USER: customer.kira
          # Random CI realm password generated earlier in this workflow.
          CI_PASS: ${{ env.CI_PASS }}
          KEYCLOAK_URL: "http://keycloak.localhost:18080"
        run: bash deploy/ci/smoke.sh

      - name: Collect troubleshooting info on failure
        if: failure()
        run: |
          echo "===== PODS -A ====="
          kubectl get pods -A || true
          echo "===== EVENTS ====="
          kubectl get events -A --sort-by=.metadata.creationTimestamp || true
          echo "===== DEPLOY LOGS ====="
          for d in bank-account-service bank-bill-service bank-deposit-service bank-notification-service bank-gateway-service bank-frontend; do
            echo "----- $d -----"
            kubectl -n bank logs deployment/$d --tail=100 || true
          done

      - name: Delete kind cluster
        if: always()
        run: kind delete cluster --name bank-ci || true
