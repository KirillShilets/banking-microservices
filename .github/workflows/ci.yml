name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g

jobs:
  backend-unit:
    name: Backend unit tests and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # dependency-submission needs write to commit the graph
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --continue

      - name: SpotBugs and formatting gates
        run: ./gradlew spotbugsMain spotbugsTest spotlessCheck --no-daemon

      - name: Assemble artifacts
        run: ./gradlew assemble --no-daemon

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: generate-submit-and-upload

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-reports
          path: |
            **/build/reports/tests/test/
            **/build/test-results/test/
            **/build/reports/spotbugs/
          retention-days: 7

  backend-integration:
    name: Backend integration tests and coverage gate
    needs: [backend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # jacocoTestCoverageVerification depends on unit + integration execution
      # data, so this step exercises both suites and then verifies the 60% gate.
      - name: Run integration tests and verify combined coverage
        run: ./gradlew integrationTest jacocoTestReport jacocoIntegrationTestReport jacocoTestCoverageVerification --no-daemon --continue

      - name: Upload integration test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-integration-reports
          path: |
            **/build/reports/tests/integrationTest/
            **/build/test-results/integrationTest/
            **/build/reports/jacoco/
            **/build/jacoco/
          retention-days: 7

      # Sonar runs on a separate runner, so the JaCoCo XML reports produced
      # here must be shipped to it. The artifact preserves the module-relative
      # layout (module/build/reports/jacoco/...) expected by the Gradle sonar
      # properties, so a plain download restores the exact paths.
      - name: Upload Sonar inputs (JaCoCo XML, exec data, compiled classes)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-inputs
          path: |
            **/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
            **/build/reports/jacoco/jacocoIntegrationTestReport/jacocoIntegrationTestReport.xml
            **/build/jacoco/*.exec
            **/build/classes/java/main
            **/build/classes/java/test
          retention-days: 3

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      # --coverage enforces the coverage thresholds declared in vitest.config.ts
      # and emits lcov.info consumed by SonarQube / sonar-frontend.
      - name: Test with coverage
        run: npm run test:coverage -- --coverage.reporter=lcov --coverage.reporter=text-summary

      - name: Build
        run: npm run build

      - name: Upload frontend coverage report for Sonar
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 3

      - name: Upload frontend build and coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-results
          path: |
            frontend/dist/
            frontend/coverage/
          retention-days: 7

  dependency-review:
    name: Dependency review
    needs: [backend-unit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Perform dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4


  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks over the full history
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --log-opts=--all --redact --no-banner \
            --report-path /src/gitleaks-report.json --report-format json

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  trivy-fs:
    name: Filesystem vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 7

  static-lint:
    name: Dockerfile, shell, workflow and YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfiles (hadolint)
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r f; do
            echo "==> hadolint $f"
            docker run --rm -i ghcr.io/hadolint/hadolint:v2.15.1 < "$f" || failed=1
          done < <(git ls-files 'Dockerfile' '**/Dockerfile')
          (( failed == 0 )) || { echo "hadolint found violations"; exit 1; }

      - name: Lint shell scripts (shellcheck)
        run: |
          set -euo pipefail
          git ls-files '*.sh' | xargs -r docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            koalaman/shellcheck:v0.10.0 -x -S warning

      - name: Lint GitHub Actions workflows (actionlint)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/actionlint_1.7.12_linux_amd64.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt \
            | grep -F 'actionlint_1.7.12_linux_amd64.tar.gz' > /tmp/actionlint-checksums.txt
          (cd /tmp && sha256sum -c actionlint-checksums.txt)
          tar -xzf /tmp/actionlint_1.7.12_linux_amd64.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          # actionlint expects file arguments; with no arguments it scans
          # .github/workflows by default.
          actionlint -color

      - name: Lint YAML files (yamllint)
        run: |
          set -euo pipefail
          pip install --quiet 'yamllint==1.35.1'
          yamllint -c .yamllint.yaml .github/workflows helm deploy

  helm-validate:
    name: Helm & Kubernetes manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4

      - name: Lint chart and render Argo-like environment combinations
        run: |
          set -euo pipefail
          mkdir -p /tmp/rendered
          # helm lint every supported values file (base + per-environment).
          for values in \
            helm/bank-platform/values.yaml \
            helm/bank-platform/values-kind.yaml \
            helm/bank-platform/values-managed.yaml \
            helm/bank-platform/values-staging.yaml \
            helm/bank-platform/values-prod.yaml; do
            echo "==> helm lint -f $values"
            helm lint helm/bank-platform -f "$values"
          done
          # Render exactly the value-file combinations Argo CD deploys:
          #   kind    = values.yaml + values-kind.yaml
          #   staging = values-managed.yaml + values-staging.yaml
          #   prod    = values-managed.yaml + values-prod.yaml
          # Rendering combinations -- not single files -- reproduces the real
          # deployment, so a placeholder or missing digest is caught where it
          # would actually ship.
          helm template bank helm/bank-platform -f helm/bank-platform/values.yaml \
            --namespace bank \
            > /tmp/rendered/base.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values.yaml \
            -f helm/bank-platform/values-kind.yaml \
            --namespace bank \
            > /tmp/rendered/kind.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values-managed.yaml \
            -f helm/bank-platform/values-staging.yaml \
            --namespace bank-staging \
            > /tmp/rendered/staging.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values-managed.yaml \
            -f helm/bank-platform/values-prod.yaml \
            --namespace bank-prod \
            > /tmp/rendered/prod.yaml

      - name: Validate rendered manifests with kubeconform
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifests
          for f in /tmp/rendered/*.yaml; do
            csplit -s -z -f /tmp/manifests/m -b "%03d.yaml" "$f" '/^---$/' '{*}'
          done
          find /tmp/manifests -type f -size 0 -delete
          count=$(find /tmp/manifests -type f | wc -l)
          [[ "$count" -gt 0 ]] || { echo "no manifests rendered"; exit 1; }
          docker run --rm \
            -v /tmp/manifests:/manifests:ro \
            --entrypoint /bin/sh \
            ghcr.io/yannh/kubeconform:v0.8.0-alpine \
            -c 'cd /manifests && /kubeconform -strict -summary *.yaml'

      - name: Enforce placeholder-free staging/prod rendered output
        run: |
          set -euo pipefail
          # The managed values file is a documented scaffold and is allowed to
          # carry xxxx placeholders; the rendered staging/prod deployments must
          # not. This mirrors the chart-level validateProduction guard.
          if grep -rniE '(REPLACE_ME|HOST_IP|xxxx|<[^>]+>)' \
              /tmp/rendered/staging.yaml /tmp/rendered/prod.yaml; then
            echo "ERROR: placeholder found in rendered staging/prod manifests" >&2
            exit 1
          fi

  iac-scan:
    name: IaC static scan (Checkov)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4

      - name: Render Argo-like environment combinations
        run: |
          set -euo pipefail
          mkdir -p /tmp/manifests
          helm template bank helm/bank-platform -f helm/bank-platform/values.yaml \
            --namespace bank > /tmp/manifests/base.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values.yaml \
            -f helm/bank-platform/values-kind.yaml --namespace bank \
            > /tmp/manifests/kind.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values-managed.yaml \
            -f helm/bank-platform/values-staging.yaml --namespace bank-staging \
            > /tmp/manifests/staging.yaml
          helm template bank helm/bank-platform -f helm/bank-platform/values-managed.yaml \
            -f helm/bank-platform/values-prod.yaml --namespace bank-prod \
            > /tmp/manifests/prod.yaml

      - name: Scan rendered manifests with Checkov
        run: |
          set -euo pipefail
          # Scans the *rendered* deployment manifests (the same combinations
          # Argo CD deploys), not raw templates. Skips:
          #  - CKV_K8S_43: image digests are enforced for prod by the chart's
          #    validateProduction guard; kind/staging pre-promotion tags are expected.
          #  - CKV_K8S_35: secrets are injected as environment variables by design
          #    (Spring Boot configuration), not mounted as files.
          #  - CKV_K8S_15: pull policy IfNotPresent is deliberate for immutable,
          #    digest/tag-pinned images; Always would force re-pulls on every node.
          #  - CKV_K8S_153: the server-snippet annotation carries response security
          #    headers; snippet execution is disabled in the pinned ingress-nginx
          #    controller (v1.11+) unless allow-snippet-annotations is enabled.
          docker run --rm \
            -v /tmp/manifests:/manifests:ro \
            -w /manifests \
            bridgecrew/checkov@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894 \
            -d . --framework kubernetes --quiet -o cli \
            --skip-check CKV_K8S_43,CKV_K8S_35,CKV_K8S_15,CKV_K8S_153

  repository-validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate repository invariants
        run: bash deploy/ci/repository-preflight.sh

  sonar:
    name: SonarQube analysis and Quality Gate
    needs: [backend-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BRANCH: ${{ github.head_ref }}
      PR_BASE: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Fail-closed: SonarQube gates merge/release. If the server secrets are not
      # configured the pipeline stops with an explicit error instead of silently
      # skipping the Quality Gate.
      - name: Verify SonarQube configuration
        run: |
          if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ]; then
            echo "ERROR: SonarQube is not configured for this repository."
            echo "Set repository secrets SONAR_HOST_URL and SONAR_TOKEN (analysis token)."
            echo "This job is a mandatory, fail-closed Quality Gate. Configure "
            echo "SonarQube (or set SONAR_PROJECT_KEY var, default applies) before"
            echo "expecting a green CI."
            exit 1
          fi
          echo "SonarQube host: ${SONAR_HOST_URL}"

      - name: Download Sonar inputs from integration job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sonar-inputs
          path: .

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # The downloaded archive contains JaCoCo execution data and compiled
      # classes, not the rendered XML reports. Regenerate the XML from the
      # exec data without re-running tests (tests already ran in the
      # backend-integration job).
      - name: Regenerate JaCoCo reports from execution data
        run: ./gradlew jacocoTestReport jacocoIntegrationTestReport -x test -x integrationTest --no-daemon

      - name: Run Sonar analysis and wait for Quality Gate
        run: |
          args=(-Dsonar.qualitygate.wait=true)
          if [ -n "${PR_NUMBER:-}" ]; then
            args+=("-Dsonar.pullrequest.key=${PR_NUMBER}")
            args+=("-Dsonar.pullrequest.branch=${PR_BRANCH}")
            args+=("-Dsonar.pullrequest.base=${PR_BASE}")
          fi
          ./gradlew sonar "${args[@]}" --no-daemon
  sonar-frontend:
    name: SonarQube frontend analysis and Quality Gate
    needs: [frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify SonarQube configuration
        run: |
          if [ -z "${SONAR_HOST_URL:-}" ] || [ -z "${SONAR_TOKEN:-}" ]; then
            echo "ERROR: SonarQube is not configured for this repository."
            echo "Set repository secrets SONAR_HOST_URL and SONAR_TOKEN (analysis token)."
            echo "This job is a mandatory, fail-closed Quality Gate. Configure "
            echo "SonarQube before expecting a green CI."
            exit 1
          fi
          echo "SonarQube host: ${SONAR_HOST_URL}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Download frontend coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Run Sonar analysis and wait for Quality Gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=spring-cloud-banking-system-frontend
            -Dsonar.projectName=frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || 'kirillshilets' }}
            -Dsonar.qualitygate.wait=true

  ci-success:
    name: CI passed
    needs: [backend-unit, backend-integration, frontend, dependency-review, gitleaks, trivy-fs, static-lint, helm-validate, iac-scan, repository-validation, sonar, sonar-frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}; then
            echo "One or more CI jobs failed, were cancelled, or were skipped"
            exit 1
          fi
          echo "All CI checks passed"
