# =============================================================================
# ExternalSecret — materialises the bank-app-secrets from Vault.
#
# Vault paths (KV v2):
#   secret/bank/staging/app-secrets   -> namespace bank-staging
#   secret/bank/prod/app-secrets      -> namespace bank-prod
#
# The generated Secret replaces the file-based .env flow end to end: the app
# deployments already reference bank-app-secrets via envFromSecret/extraEnv, so
# no chart changes are needed. For production switch the SecretStore to
# vault-prod and the remoteRef path to secret/bank/prod/app-secrets.
#
# NOTE: database-credential Secrets (account-db-credentials, etc.) consumed by
# CNPG are also sourced from Vault (secret/bank/<env>/db-credentials) with
# cnpg.io/reload=true so the operator picks up rotated values.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-app-secrets
  namespace: bank-staging
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: bank-app-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: ACCOUNT_DB_USER
      remoteRef: { key: bank/staging/app-secrets, property: account_db_user }
    - secretKey: ACCOUNT_DB_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: account_db_password }
    - secretKey: BILL_DB_USER
      remoteRef: { key: bank/staging/app-secrets, property: bill_db_user }
    - secretKey: BILL_DB_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: bill_db_password }
    - secretKey: DEPOSIT_DB_USER
      remoteRef: { key: bank/staging/app-secrets, property: deposit_db_user }
    - secretKey: DEPOSIT_DB_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: deposit_db_password }
    - secretKey: NOTIFICATION_DB_USER
      remoteRef: { key: bank/staging/app-secrets, property: notification_db_user }
    - secretKey: NOTIFICATION_DB_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: notification_db_password }
    - secretKey: RABBITMQ_USERNAME
      remoteRef: { key: bank/staging/app-secrets, property: rabbitmq_username }
    - secretKey: RABBITMQ_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: rabbitmq_password }
    - secretKey: MAIL_USERNAME
      remoteRef: { key: bank/staging/app-secrets, property: mail_username }
    - secretKey: MAIL_PASSWORD
      remoteRef: { key: bank/staging/app-secrets, property: mail_password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bank-app-secrets
  namespace: bank-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-prod
    kind: SecretStore
  target:
    name: bank-app-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/managed-by: external-secrets
  data:
    - secretKey: ACCOUNT_DB_USER
      remoteRef: { key: bank/prod/app-secrets, property: account_db_user }
    - secretKey: ACCOUNT_DB_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: account_db_password }
    - secretKey: BILL_DB_USER
      remoteRef: { key: bank/prod/app-secrets, property: bill_db_user }
    - secretKey: BILL_DB_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: bill_db_password }
    - secretKey: DEPOSIT_DB_USER
      remoteRef: { key: bank/prod/app-secrets, property: deposit_db_user }
    - secretKey: DEPOSIT_DB_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: deposit_db_password }
    - secretKey: NOTIFICATION_DB_USER
      remoteRef: { key: bank/prod/app-secrets, property: notification_db_user }
    - secretKey: NOTIFICATION_DB_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: notification_db_password }
    - secretKey: RABBITMQ_USERNAME
      remoteRef: { key: bank/prod/app-secrets, property: rabbitmq_username }
    - secretKey: RABBITMQ_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: rabbitmq_password }
    - secretKey: MAIL_USERNAME
      remoteRef: { key: bank/prod/app-secrets, property: mail_username }
    - secretKey: MAIL_PASSWORD
      remoteRef: { key: bank/prod/app-secrets, property: mail_password }
