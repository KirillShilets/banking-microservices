# =============================================================================
# Vault-based secret management (Stage H of the CI/CD spec).
#
# This directory holds the External Secrets Operator (ESO) resources that pull
# application secrets out of a self-hosted HashiCorp Vault and materialise them
# as Kubernetes Secrets inside bank-staging / bank-prod.
#
# Prerequisite (see deploy/argocd/eso-vault-install.md):
#   - Vault installed in HA mode (NOT -dev), with a Kubernetes auth method
#     configured for the ESO service account
#   - External Secrets Operator installed in external-secrets-system
#
# The SecretStore uses the ESO ServiceAccount token to authenticate against the
# Vault Kubernetes auth backend (path: kubernetes), role: eso-apps.
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: bank-staging
spec:
  provider:
    vault:
      server: "https://vault.bank.internal:8200"   # Vault endpoint (VIP / LB)
      path: kv                                      # KV v2 mount
      version: v2
      caProvider:
        type: Secret
        name: vault-ca-cert
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bank-apps
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-prod
  namespace: bank-prod
spec:
  provider:
    vault:
      server: "https://vault.bank.internal:8200"
      path: kv
      version: v2
      caProvider:
        type: Secret
        name: vault-ca-cert
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: bank-apps
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: bank-prod
