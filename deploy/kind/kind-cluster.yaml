kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # ingress-nginx's kind manifest selects on this label.
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # ingress-nginx's kind manifest (deploy/static/provider/kind) binds
      # hostPort 80/443 directly on the node, so the node container has to
      # expose exactly those container ports. Mapping host 80/443 to the
      # NodePort range (30080/30443) breaks ingress: the controller never
      # listens there and http://app.localhost answers with an empty reply.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker

networking:
  disableDefaultCNI: false
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
