spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/account_service_database
    username: account_service_admin
    password: accountserviceadmin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: UTC

server:
  port: 8081

eureka:
  client:
    healthcheck:
      enabled: true