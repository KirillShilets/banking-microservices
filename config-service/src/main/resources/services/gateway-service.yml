server:
  port: 8989

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: account_service_route
              uri: lb://account-service
              predicates:
                - Path=/accounts/**
            - id: bill_service_route
              uri: lb://bill-service
              predicates:
                - Path=/bills/**
            - id: deposit_service_route
              uri: lb://deposit-service
              predicates:
                - Path=/deposits/**
          httpclient:
            wiretap: true
          httpserver:
            wiretap: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/