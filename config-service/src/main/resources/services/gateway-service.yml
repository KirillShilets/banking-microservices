server:
  port: 8989

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account_service_route
              # Eureka is not part of the platform: routes target services directly.
              # The kubernetes profile overrides these with cluster DNS names.
              uri: http://localhost:8081
              predicates:
                - Path=/accounts/**
            - id: bill_service_route
              uri: http://localhost:8082
              predicates:
                - Path=/bills/**
            - id: deposit_service_route
              uri: http://localhost:8083
              predicates:
                - Path=/deposits/**
          httpclient:
            wiretap: false
          httpserver:
            wiretap: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "http://localhost:3000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
