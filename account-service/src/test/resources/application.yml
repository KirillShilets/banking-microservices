spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
