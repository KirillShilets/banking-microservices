spring:
  application:
    name: account-service
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  rabbitmq:
    dynamic: false
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://127.0.0.1:1/dummy

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
